<h1>{{ post.title }}</h1>
<p>Дата: {{ post.created_at }}</p>
<p>Просмотров: {{ post.views_count }}</p>
{% if post.preview %}
    <img src="{{ post.preview.url }}" alt="{{ post.title }}" style="max-width: 300px;">
{% endif %}
<div>{{ post.content|linebreaks }}</div>
<p>Опубликовано: {% if post.is_published %}Да{% else %}Нет{% endif %}</p>
<a href="{% url 'blog:list' %}">Назад к списку</a>
<a href="{% url 'blog:update' post.pk %}">Редактировать</a>
<a href="{% url 'blog:delete' post.pk %}">Удалить</a>
